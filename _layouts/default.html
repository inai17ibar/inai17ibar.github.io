<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#FAFAF8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FAFAF8'/%3E%3Ctext x='50' y='74' font-size='62' text-anchor='middle' font-family='serif' fill='%2323262D'%3E稲%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
    <div class="sheet">
        <header class="site-head">
            <a class="wordmark" href="/">
                <span class="wordmark-ja">稲谷壮一郎</span><span class="wordmark-en">SOICHIRO INATANI</span>
            </a>
            <nav class="site-nav">
                <a href="/" {% if page.url == "/" %}aria-current="page"{% endif %}>Home</a>
                <a href="/n1/" {% if page.url contains "/n1/" %}aria-current="page"{% endif %}>n=1</a>
                <a href="/about/" {% if page.url == "/about/" %}aria-current="page"{% endif %}>About</a>
                <a href="/cv/" {% if page.url == "/cv/" %}aria-current="page"{% endif %}>CV</a>
                <a href="/cv-ja/" {% if page.url == "/cv-ja/" %}aria-current="page"{% endif %}>CV 日本語</a>
            </nav>
        </header>

        <main>
            {{ content }}
        </main>

        <footer class="site-foot">
            <p>&copy; {{ 'now' | date: '%Y' }} Soichiro Inatani — Tokyo, Japan</p>
        </footer>
    </div>
</body>
</html>
